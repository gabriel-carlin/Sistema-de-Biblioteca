services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: biblioteca_mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      - mssql
    volumes:
      - ./init.sql:/init.sql
    entrypoint: >
      /bin/bash -c "
      until /opt/mssql-tools18/bin/sqlcmd -S mssql -U ${DB_USER} -P '${DB_PASSWORD}' -C -i /init.sql; do
        sleep 2;
      done;
      echo 'Banco BibliotecaDB pronto!';
      "

volumes:
  mssql_data: